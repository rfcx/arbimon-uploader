name: Build/release

on:
  push:
    tags:
      - v**

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: npm install --legacy-peer-deps
        env:
          PYTHON: python
          npm_config_python: python
          NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

      - name: Build Windows release
        if: ${{ vars.WINDOWS_SIGN_ENABLED == 'true' }}
        shell: bash
        run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WIN_CERT }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PWD }}
          PYTHON: python
          npm_config_python: python
          NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

      - name: Build Windows release (unsigned)
        if: ${{ vars.WINDOWS_SIGN_ENABLED != 'true' }}
        shell: bash
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PYTHON: python
          npm_config_python: python
          NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

      - name: List build artifacts
        shell: bash
        run: |
          echo "build directory:"
          find build -maxdepth 4 -type f | sort || true
          echo "workspace RELEASES files:"
          find . -maxdepth 6 -name RELEASES -type f | sort || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/squirrel-windows*/Arbimon.Uploader Setup *.exe
            build/squirrel-windows*/RELEASES
            build/squirrel-windows*/rfcx-ingest-*.nupkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
